# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.4"
  python_check_max: "3.15"
  ruff_min: "0.8.0"

package:
  name: python-lsp-ruff
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://pypi.org/packages/source/p/python-lsp-ruff/python_lsp_ruff-${{ version }}.tar.gz
    sha256: 0c101db5ba54390dd0d3401c73b291d909fe5e5295e85ab2cfe9c21d08ef0905
  # PyPI sdist missing test files, see https://github.com/python-lsp/python-lsp-ruff/issues/117
  - target_directory: src
    url: https://github.com/python-lsp/python-lsp-ruff/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 1c4b8a4f1073192cb931a13e1590f4aef5fb7942dd4b371cf15f73facc296870

build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - lsprotocol >=2023.0.1
    - cattrs !=23.2.1
    - python >=${{ python_min }}
    - python-lsp-server-base
    - ruff >=${{ ruff_min }}
    - tomli >=1.1.0

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/python-lsp-ruff/**
      site_packages:
        - pylsp_ruff/**
        - pylsp_ruff-${{ version }}.dist-info/**
  - python:
      imports: pylsp_ruff
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/tests/**
    requirements:
      run:
        - coverage
        - pytest
        - python ${{ python_min }}.*
    script:
      - cd src
      - coverage run --source=pylsp_ruff --branch -m pytest -vv --color=yes --tb=long
      - coverage report --show-missing --skip-covered --fail-under=85

about:
  summary: Ruff linting plugin for pylsp
  license: MIT
  license_file: dist/LICENSE
  homepage: https://pypi.org/project/python-lsp-ruff
  repository: https://github.com/python-lsp/python-lsp-ruff

extra:
  recipe-maintainers:
    - bollwyvl
    - jhossbach
    - jonas-w
